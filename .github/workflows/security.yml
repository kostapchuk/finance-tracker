name: Security & Quality

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Monday 9am UTC

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Gate on what actually ships. This is a client-side PWA, so nothing from
      # devDependencies reaches users. The dev tree currently carries an
      # unfixable advisory (brace-expansion GHSA-mh99-v99m-4gvg, patched only in
      # >=5.0.8, reachable via minimatch@3 which eslint-plugin-import still pins).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # Informational: keeps dev-tree advisories visible without blocking merges.
      - name: Audit all dependencies (non-blocking)
        run: npm audit --audit-level=high || true

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: '.lighthouserc.json'
