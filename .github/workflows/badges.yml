name: Badges

# Publishes shields.io endpoint JSON (Lighthouse scores, bundle size, type
# coverage, production vulnerabilities) to the orphan `badges` branch, which
# the README badges read from.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  badges:
    name: Update Badges
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Type coverage
        run: npx type-coverage -p tsconfig.app.json --strict > type-coverage.txt
      - name: Bundle size
        run: npx size-limit --json > size-limit.json || true
      - name: Production vulnerabilities
        run: npm audit --omit=dev --json > audit.json || true
      - name: Lighthouse
        continue-on-error: true
        run: npx --yes @lhci/cli@0.15.1 collect --config=.lighthouserc.json
      - name: Generate badge JSON
        run: node scripts/badges.mjs badges-out
      - name: Publish to badges branch
        working-directory: badges-out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Data-only branch: stop Vercel's Git integration from trying to deploy it.
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git add .
          git commit -q -m "Update badges for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
